[project]
name = "babp-build-guide"
version = "0.1.0"
description = "Build tooling for the BABP MkDocs assembly guide"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mkdocs==1.6.1",
  "mkdocs-glightbox==0.5.2",
  "mkdocs-material==9.7.6",
  "python-docx==1.2.0",
  "PyYAML==6.0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
