sections:
  stock-magwell:
    base:
      components:
        - Stock
        - StockButt
        - StockButtBackplate
        - ReleaseNub
        - Release
        - Magwell
      hardware:
        - screw_6_32_5_8_phillips: 2
        - spring_0_625: 1
      consumables:
        - superglue

  shroud:
    base: {}
    variants:
      railgun:
        components:
          - RG_MainBody
          - RG_Base
          - RG_TopSupportBar
          - RG_BottomSupportBar
          - RG_BottomRail
        hardware:
          - screw_6_32_phillips: 3
          - screw_6_32_socket_head: 5

      bipod-sub-assembly:
        components:
          - BipodCore
          - RightLeg
          - LeftLeg
          - RightLockNub
          - LeftLockNub
          - BipodCap
          - BipodButton
        hardware:
          - screw_6_32_socket_head: 2
          - screw_6_32_phillips: 1
          - dowel_3_32: 2
          - spring_bipod_lock: 1

      bipod:
        components:
          - RGB_MainBody
          - RGB_Base
          - RGB_Insert
          - RGB_TopSupportBar
          - RGB_BottomSupportBar
          - BipodSubAssembly
        hardware:
          - heat_set_insert_6_32: 1
          - screw_6_32_phillips: 1
          - screw_6_32_socket_head: 6
        consumables:
          - loctite

  receiver:
    base:
      components:
        - Receiver
        - Trigger
        - Sear
        - Grip
        - TriggerGuard
      hardware:
        - screw_6_32_phillips: 2
        - dowel_3_32_quarter: 3
        - spring_0_625: 1
        - ptfe_tube_8mm: 2
      consumables:
        - superglue
    variants:
      dual-window:
        hardware:
          - dowel_3_32_quarter: 1

  gear-tensioner:
    base:
      components:
        - FrontConnectorCap
        - FrontConnectorBase
        - TensionerBlock
        - NutCap
        - LockBlock
        - LockBlockCap
        - BarrelGear
        - SideGear
        - OuterGear
        - InnerGear
      hardware:
        - dowel_3_32_3_4: 2
        - nut_10_32: 2
        - screw_10_32_1_1_4_oval: 1
        - heat_set_insert_6_32: 1
        - washer_generic: 1
        - nut_6_32: 2
        - bolt_6_32_5_8_socket: 2
        - screw_6_32_5_16_phillips: 4
        - thumbscrew_6_32: 2
      consumables:
        - superglue
        - lubricant_light
    variants:
      shroud-selection:
        components:
          - RG_MainBody
          - RGB_MainBody

  prime-block:
    base:
      components:
        - PrimeBlock
        - PumpBars
        - CatchLever
        - Barrel
        - Bearing_623
      hardware:
        - m3_socket_head_8mm: 7
        - dowel_3_32_quarter: 1
    variants:
      bolt-action:
        components:
          - HandleHead
        hardware:
          - nut_6_32: 4
          - screw_6_32_phillips: 4
          - screw_6_32_socket_head: 4
          - screw_6_32_2in_phillips: 4

      straight-pull:
        components:
          - HandleHead
        hardware:
          - nut_6_32: 4
          - screw_6_32_phillips: 4
          - screw_6_32_socket_head: 4
          - screw_6_32_2in_phillips: 4

      dual-straight-pull:
        components:
          - HandleHead
        hardware:
          - nut_6_32: 4
          - screw_6_32_phillips: 4
          - screw_6_32_socket_head: 4
          - screw_6_32_2in_phillips: 4

  core:
    base:
      components:
        - PlungerHead
        - CatchTube
        - CatchEnd
        - SpringBase
        - Spring
        - Catch
        - CatchLever
        - CatchBearing
      hardware:
        - heat_set_insert_6_32: 4
        - screw_6_32_socket_head: 8
        - screw_6_32_phillips: 4
        - spring_0_625: 1
        - oring_127: 2
        - oring_016: 1
      consumables:
        - loctite
        - lubricant_light

  loader:
    base:
      components:
        - Pusher
        - TransferBar
        - TransferBarAdapter
      hardware:
        - screw_1_4_20_3_8: 1
        - oring_202: 1
        - screw_6_32_socket_head: 2

  turnaround:
    base:
      components:
        - Turnaround
        - TubeHolder
        - TubeHolderInsert
        - PlungerTube
      hardware:
        - oring_016: 1
        - oring_127: 1
      consumables:
        - superglue
        - lubricant_light

  final:
    base:
      components:
        - BodyBars
        - TubeSpacer
        - ReceiverAssembly
        - CoreAssembly
        - MidBody
        - Barrel
        - GearTensionerAssembly
      hardware:
        - quick_release_pin: 2
      consumables:
        - lubricant_light
    variants:
      scar:
        components:
          - SCAR
        hardware:
          - oring_016: 2
